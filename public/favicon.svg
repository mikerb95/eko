<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Favicon EKOSOLV: versión simplificada del isotipo para tamaños mínimos.
  El isotipo completo (anillo + tres hojas con nervadura) vive en
  /brand/ekosolv-isotype.png y se usa donde hay espacio: apple-touch-icon, OG.
  A 16px ese detalle se empasta, así que aquí se reduce a la silueta esencial:
  círculo de marca + una hoja calada en blanco.
-->
<svg
   viewBox="0 0 64 64"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="32" fill="#1F8A8A" />
  <path
     d="M50 15 C 26 16, 15 29, 16 41 C 17 49, 25 52, 33 49 C 46 44, 51 28, 50 15 Z"
     fill="#ffffff" />
</svg>
